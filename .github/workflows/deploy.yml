name: CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        description: Deploy this main revision to production
        default: false
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { service: Sync, image: sync }
          - { service: Connector, image: connector }
          - { service: Admin, image: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: SERVICE=${{ matrix.service }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
  deploy:
    needs: publish
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: healthsynki-production
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      HEALTHSYNKI_DOMAIN: ${{ vars.HEALTHSYNKI_DOMAIN }}
      HEALTHSYNKI_DEPLOYMENT_PROFILE: ${{ vars.HEALTHSYNKI_DEPLOYMENT_PROFILE }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Deploy and verify rollouts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/healthsynki-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf %s "$KUBECONFIG_B64" | base64 -d > "$KUBECONFIG"
          scripts/deploy.sh
