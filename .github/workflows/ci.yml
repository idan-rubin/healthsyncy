name: Code checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore HealthSyncy.slnx
      - run: dotnet build HealthSyncy.slnx -c Release --no-restore
      - run: checks/mongo.sh --container
      - run: python3 checks/manifests.py
  ios:
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - run: dotnet workload install ios --version 11.0.100.1
      - run: dotnet build HealthSyncy.iOS -c Release -r iossimulator-arm64 -p:EnableCodeSigning=true -p:CodesignKey=- -p:CodesignEntitlements=DeviceEntitlements.plist -p:CodesignRequireProvisioningProfile=false
      - name: Install and launch the iPhone companion
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl create HealthSyncy-CI com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-2)
          xcrun simctl bootstatus "$device" -b
          app=$(find HealthSyncy.iOS/bin/Release/net11.0-ios/iossimulator-arm64 -maxdepth 1 -name '*.app' -print -quit)
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          codesign --verify --deep --strict "$app"
          xcrun simctl install "$device" "$app"
          report() {
            cat "$RUNNER_TEMP"/companion.{err,out} 2>/dev/null || true
            find "$HOME/Library/Logs/DiagnosticReports" -iname '*HealthSyncy*.ips' -exec head -c 24000 {} + || true
            xcrun simctl spawn "$device" log show --last 5m --style compact --predicate 'process == "HealthSyncy.iOS" OR (eventMessage CONTAINS[c] "org.healthsyncy.companion" AND messageType == error)' | tail -70 || true
          }
          diagnose() {
            report
            executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
            container=$(xcrun simctl get_app_container "$device" "$bundle" app)
            file "$container/$executable"
            otool -L "$container/$executable"
            ls -la "$container" | head -80
            xcrun simctl spawn "$device" log show --last 4m --style compact --predicate 'eventMessage CONTAINS[c] "HealthSyncy" OR process == "amfid" OR process == "ReportCrash"' | tail -180 || true
          }
          trap diagnose ERR
          xcrun simctl launch "$device" com.apple.Preferences
          xcrun simctl launch "$device" "$bundle"
          sleep 10
          xcrun simctl terminate "$device" "$bundle"
