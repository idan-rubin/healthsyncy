name: Code checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore HealthSynki.slnx
      - run: dotnet build HealthSynki.slnx -c Release --no-restore
      - run: checks/mongo.sh
      - run: python3 checks/manifests.py
  ios:
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - run: dotnet workload install ios --version 11.0.100.1
      - run: dotnet build HealthSynki.iOS -c Debug -r iossimulator-arm64 -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false
      - name: Install and launch the iPhone companion
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True)
                     if ".iOS-27-" in runtime for d in devices[runtime]
                     if d["isAvailable"] and d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b
          app=$(find HealthSynki.iOS/bin/Debug/net11.0-ios/iossimulator-arm64 -maxdepth 1 -name '*.app' -print -quit)
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$device" "$app"
          launch=$(xcrun simctl launch "$device" "$bundle")
          pid=${launch##*: }
          [[ "$pid" =~ ^[0-9]+$ ]]
          for attempt in {1..10}; do
            sleep 1
            kill -0 "$pid"
          done
