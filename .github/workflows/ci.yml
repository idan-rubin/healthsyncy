name: Code checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore HealthSynki.slnx
      - run: dotnet build HealthSynki.slnx -c Release --no-restore
      - run: checks/mongo.sh
      - run: python3 checks/manifests.py
  ios:
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - run: dotnet workload install ios --version 11.0.100.1
      - run: dotnet build HealthSynki.iOS -c Debug -r iossimulator-arm64 -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false
      - name: Install and launch the iPhone companion
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl create HealthSynki-CI com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-2)
          xcrun simctl bootstatus "$device" -b
          app=$(find HealthSynki.iOS/bin/Debug/net11.0-ios/iossimulator-arm64 -maxdepth 1 -name '*.app' -print -quit)
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          codesign --force --sign - --entitlements HealthSynki.iOS/DeviceEntitlements.plist "$app"
          xcrun simctl install "$device" "$app"
          launch=$(xcrun simctl launch --stdout="$RUNNER_TEMP/companion.out" --stderr="$RUNNER_TEMP/companion.err" "$device" "$bundle")
          echo "$launch"
          pid=${launch##*: }
          [[ "$pid" =~ ^[0-9]+$ ]]
          for attempt in {1..10}; do
            sleep 1
            if ! xcrun simctl spawn "$device" launchctl list | awk -v pid="$pid" '$1 == pid {found=1} END {exit !found}'; then
              cat "$RUNNER_TEMP"/companion.{err,out} || true
              find "$HOME/Library/Logs/DiagnosticReports" -iname 'HealthSynki*.ips' -exec head -c 16000 {} \\; || true
              exit 1
            fi
          done
