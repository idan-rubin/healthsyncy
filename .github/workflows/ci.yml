name: Code checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore HealthSyncy.slnx
      - run: dotnet build HealthSyncy.slnx -c Release --no-restore
      - name: Check the rule set
        run: |
          cp .editorconfig.ci .editorconfig
          dotnet format HealthSyncy.slnx --verify-no-changes --no-restore
          git checkout .editorconfig
      - run: dotnet test --solution HealthSyncy.slnx -c Release --no-build --coverage --coverage-output-format cobertura --results-directory "$GITHUB_WORKSPACE/TestResults"
      - run: python3 checks/coverage.py TestResults 90
      - run: checks/mongo.sh --container
      - run: python3 checks/manifests.py
  ios:
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src/HealthSyncy.Mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100
      - run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
      - run: dotnet workload install ios --version 11.0.100.1
      - run: dotnet build HealthSyncy.Mobile.EntryPoint -c Release -r iossimulator-arm64 -p:EnableCodeSigning=true -p:CodesignKey=- -p:CodesignEntitlements=DeviceEntitlements.plist -p:CodesignRequireProvisioningProfile=false
      - name: Check the rule set
        run: |
          cp ../../.editorconfig.ci ../../.editorconfig
          dotnet format HealthSyncy.Mobile.EntryPoint --verify-no-changes
          git checkout ../../.editorconfig
      - name: Install and launch the iPhone companion
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl create HealthSyncy-CI com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-2)
          xcrun simctl bootstatus "$device" -b
          app=$(find HealthSyncy.Mobile.EntryPoint/bin/Release/net11.0-ios/iossimulator-arm64 -maxdepth 1 -name '*.app' -print -quit)
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          codesign --verify --deep --strict "$app"
          xcrun simctl install "$device" "$app"
          report() {
            cat "$RUNNER_TEMP"/companion.{err,out} 2>/dev/null || true
            find "$HOME/Library/Logs/DiagnosticReports" -iname '*HealthSyncy*.ips' -exec head -c 24000 {} + || true
            xcrun simctl spawn "$device" log show --last 5m --style compact --predicate 'process == "HealthSyncy.Mobile.EntryPoint" OR (eventMessage CONTAINS[c] "org.healthsyncy.companion" AND messageType == error)' | tail -70 || true
          }
          diagnose() {
            report
            executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
            container=$(xcrun simctl get_app_container "$device" "$bundle" app)
            file "$container/$executable"
            otool -L "$container/$executable"
            ls -la "$container" | head -80
            xcrun simctl spawn "$device" log show --last 4m --style compact --predicate 'eventMessage CONTAINS[c] "HealthSyncy" OR process == "amfid" OR process == "ReportCrash"' | tail -180 || true
          }
          trap diagnose ERR
          xcrun simctl launch "$device" com.apple.Preferences
          xcrun simctl launch "$device" "$bundle"
          sleep 10
          xcrun simctl terminate "$device" "$bundle"
