<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 192" width="960" height="192">
  <title>HealthSyncy’s self-hosted sync</title>
  <desc>Daily activity totals flow from an iPhone to a server you host. An authorized MCP client can read them there.</desc>
  <defs>
    <linearGradient id="navy" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#1b2542"/>
      <stop offset="1" stop-color="#0e1528"/>
    </linearGradient>
    <linearGradient id="coral">
      <stop stop-color="#ff895d"/>
      <stop offset="1" stop-color="#ff596d"/>
    </linearGradient>
  </defs>
  <rect width="960" height="192" rx="18" fill="url(#navy)"/>

  <g fill="none" stroke="#647598" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 79h206m-6-5 6 5-6 5"/>
    <path d="M533 79h204m-6-5 6 5-6 5"/>
  </g>

  <g transform="translate(180 79)">
    <rect x="-25" y="-38" width="50" height="76" rx="10" fill="none" stroke="#e9edf8" stroke-width="3"/>
    <path d="M-7-31H7M-6 31H6" fill="none" stroke="#9daac5" stroke-width="3" stroke-linecap="round"/>
    <g id="sync">
      <path d="M-15.7-3.2A16 16 0 0 1 11.5-11.1" fill="none" stroke="#e9edf8" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M14.5-14 15.7-6.8 8.5-8.2Z" fill="#e9edf8" stroke="#e9edf8" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <use href="#sync" transform="rotate(180)"/>
    <g transform="translate(0 -1) scale(.6)">
      <path d="M0 18C-3 11-16 5-16-5c0-11 13-13 16-4 3-9 16-7 16 4C16 5 3 11 0 18Z" fill="url(#coral)"/>
      <path d="M-16 1h9l3-4 3 8 4-13 3 9h10" fill="none" stroke="#182139" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(480 79)" stroke-width="3">
    <g fill="none" stroke="#e9edf8">
      <rect x="-34" y="-28" width="68" height="23" rx="6"/>
      <rect x="-34" y="5" width="68" height="23" rx="6"/>
    </g>
    <path d="M-21-16.5h13m-13 33h13" stroke="#9daac5" stroke-linecap="round"/>
    <g fill="#ff806d">
      <circle cx="21" cy="-16.5" r="3"/>
      <circle cx="21" cy="16.5" r="3"/>
    </g>
  </g>

  <g transform="translate(780 79)">
    <path d="M-23-28h46a11 11 0 0 1 11 11v26a11 11 0 0 1-11 11H-4l-15 12V20h-4a11 11 0 0 1-11-11v-26a11 11 0 0 1 11-11Z" fill="none" stroke="#e9edf8" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#ff806d">
      <circle cx="-13" cy="-4" r="3"/>
      <circle cy="-4" r="3"/>
      <circle cx="13" cy="-4" r="3"/>
    </g>
  </g>

  <g fill="#e9edf8" font-family="system-ui, sans-serif" font-size="26" font-weight="500" text-anchor="middle">
    <text x="180" y="157">iPhone</text>
    <text x="480" y="157">Your server</text>
    <text x="780" y="157">MCP client</text>
  </g>
</svg>
